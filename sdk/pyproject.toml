[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentlens"
version = "0.3.0"
description = "Open source observability runtime for AI agents: execution DAGs, run diffing, budget guards."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Avi Chauhan" }]
keywords = ["agents", "observability", "tracing", "llm", "langchain", "crewai"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
langchain = ["langchain-core>=0.2"]

[tool.setuptools.packages.find]
include = ["agentlens*"]
